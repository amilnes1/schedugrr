name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Test packaged Windows app
        run: npm run test:desktop
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release\ScheduGrr-*.exe, release\ScheduGrr-*.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content release\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ScheduGrr-Windows-${{ github.ref_name }}
          path: |
            release/ScheduGrr-*-setup.exe
            release/ScheduGrr-*.zip
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
      - name: Publish unsigned Windows prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          @(
            "ScheduGrr $version is an open-source desktop planner preview."
            ""
            "Windows x64 downloads:"
            ""
            "- ScheduGrr-$version-x64-setup.exe — interactive installer"
            "- ScheduGrr-$version-x64.zip — portable archive"
            "- SHA256SUMS-windows.txt — download checksums"
            ""
            "This preview has passed ScheduGrr's unit, API, and packaged Electron"
            "tests on a GitHub-hosted Windows runner. The binaries are not yet"
            "Authenticode-signed, so Windows may display an Unknown Publisher or"
            "Microsoft Defender SmartScreen warning. Review the source and checksum"
            "before installing."
            ""
            "See CHANGELOG.md for the complete release notes."
          ) | Set-Content release/RELEASE_NOTES.md

          $releaseFiles = @(
            (Get-ChildItem release/ScheduGrr-*-setup.exe).FullName
            (Get-ChildItem release/ScheduGrr-*.zip).FullName
            (Get-Item release/SHA256SUMS-windows.txt).FullName
          )

          gh release create "${{ github.ref_name }}" $releaseFiles `
            --verify-tag `
            --prerelease `
            --title "ScheduGrr ${{ github.ref_name }}" `
            --notes-file release/RELEASE_NOTES.md
