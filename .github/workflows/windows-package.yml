name: Windows package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run desktop:dist:win
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test packaged Rust API
        run: npm run test:tauri:api
        env:
          SCHEDUGRR_QA_EXECUTABLE: src-tauri/target/x86_64-pc-windows-msvc/release/schedugrr.exe
      - name: Test native Windows WebView2 app
        shell: pwsh
        # WebView2 150+ ignores debug environment variables in elevated hosts.
        # Run UI QA at medium integrity, as Tauri's own Windows CI does.
        # https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645
        run: |
          if (-not (Get-Command gsudo -ErrorAction SilentlyContinue)) {
            choco install gsudo -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the test privilege helper' }
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          icacls "$env:GITHUB_WORKSPACE" /grant "${identity}:(OI)(CI)M" /Q
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant the runner user workspace access' }
          gsudo --integrity Medium node tests/e2e/tauri-windows-qa.mjs "$env:SCHEDUGRR_QA_EXECUTABLE"
          exit $LASTEXITCODE
        env:
          SCHEDUGRR_QA_EXECUTABLE: src-tauri/target/x86_64-pc-windows-msvc/release/schedugrr.exe
      - name: Upload native UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ScheduGrr-Windows-UI-diagnostics
          path: release/windows-qa/
          if-no-files-found: ignore
      - name: Prepare portable ZIP and enforce 50 MB size budget
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe release/
          $exe = 'src-tauri/target/x86_64-pc-windows-msvc/release/schedugrr.exe'
          if ((Get-Item $exe).Length -ge 50000000) { throw 'Application exceeds the 50 MB size budget' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path $exe -DestinationPath "release/ScheduGrr-$version-x64.zip"
          Get-ChildItem release/*.exe,release/*.zip | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content release/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ScheduGrr-Windows-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
      - name: Stage Windows downloads in a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @(
            'ScheduGrr Tauri desktop preview for Windows x64.'
            ''
            'Includes an NSIS installer, portable ZIP, and SHA-256 checksums.'
            'Uses the shared Microsoft WebView2 runtime; the installer obtains it if missing.'
            'Board, calendar, task editing, local API, and persistence are covered by automated tests.'
            'Native account-calendar sync remains macOS-only. This preview is unsigned.'
          ) | Set-Content release/RELEASE_NOTES.md
          $tag = '${{ github.ref_name }}'
          $files = @((Get-ChildItem release/*.exe,release/*.zip).FullName) + @((Get-Item release/SHA256SUMS-windows.txt).FullName)
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already published; refusing to replace tested downloads'
            }
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --verify-tag --draft --prerelease --title "ScheduGrr $tag" --notes-file release/RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the Windows release downloads' }
